name: Protocol checks
on: [push, pull_request]
jobs:
  cloudflare-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix cloudflare
      - run: npm ci
      - run: node scripts/build-cloud-assets.mjs
      - run: npm --prefix cloudflare run check
      - run: node cloudflare/node_modules/wrangler/bin/wrangler.js d1 migrations apply flashfirm-free --local --config cloudflare/wrangler.jsonc
      - run: node scripts/prepare-cloud-local.mjs
      - run: node cloudflare/node_modules/wrangler/bin/wrangler.js d1 execute flashfirm-free --local --config cloudflare/wrangler.jsonc --file .runtime/cloudflare/local-test-token.sql
      - name: Verify local Workers, D1 and Workflows together
        run: |
          npm --prefix cloudflare run dev > /tmp/flashfirm-cloud-local.log 2>&1 &
          cloud_pid=$!
          trap 'kill "$cloud_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:43184/healthz; then break; fi
            sleep 1
          done
          node scripts/check-cloud-local.mjs
  managed-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flashfirm-smoke .
      - name: Start isolated managed service
        run: docker run -d --name flashfirm-smoke --read-only --tmpfs /tmp --mount type=volume,target=/data -p 127.0.0.1:43183:43180 -e FLASHFIRM_PUBLIC_ORIGIN=https://service.example flashfirm-smoke
      - name: Verify health and access boundary
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H 'Host: service.example' http://127.0.0.1:43183/healthz; then break; fi
            sleep 2
          done
          curl --fail --silent -H 'Host: service.example' http://127.0.0.1:43183/healthz
          test "$(curl --silent -o /dev/null -w '%{http_code}' -H 'Host: service.example' http://127.0.0.1:43183/api/workspaces)" = 401
          test "$(curl --silent -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:43183/healthz)" = 403
      - if: always()
        run: docker rm -f -v flashfirm-smoke || true
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: node scripts/check-public.mjs
      - run: npm run build:pages
  near-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:sandbox
      - run: rustc --edition 2021 --test contracts/treasury/src/ledger.rs -o /tmp/flashfirm-ledger-tests
      - run: /tmp/flashfirm-ledger-tests
      - run: rustc --edition 2021 --test contracts/treasury/src/review.rs -o /tmp/flashfirm-review-tests
      - run: /tmp/flashfirm-review-tests
